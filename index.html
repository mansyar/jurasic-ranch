<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec850" />
    <meta
      name="description"
      content="Jurasic Ranch — watch baby Trike and Stego waddle. Offline-first PWA."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Jurasic Ranch — Trike Waddle Walk</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #dff3d8;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #walk-button {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 72px;
        min-height: 72px;
        padding: 0 28px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        border: none;
        border-radius: 999px;
        background: #2f7d3b;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
      #walk-button:active {
        transform: translateX(-50%) scale(0.96);
      }
      #status {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: #2f4a2f;
        font-size: 14px;
      }
      #species {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
        pointer-events: none;
      }
      #species li {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: #2f4a2f;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <p id="status" role="status">Loading…</p>
      <ul id="species" aria-label="Dino babies">
        <li>🦕 Trike</li>
        <li>🦖 Stego</li>
      </ul>
      <button id="walk-button" type="button" aria-pressed="false">Walk</button>
    </main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
