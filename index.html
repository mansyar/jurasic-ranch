<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7ec850" />
    <meta
      name="description"
      content="Jurasic Ranch — watch baby Trike, Stego, and Brachio waddle. Offline-first PWA."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Jurasic Ranch — Trike, Stego and Brachio</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #dff3d8;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      body {
        touch-action: manipulation;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #walk-button {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 72px;
        min-height: 72px;
        padding: 0 28px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        border: none;
        border-radius: 999px;
        background: #2f7d3b;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        touch-action: manipulation;
      }
      #walk-button:active {
        transform: translateX(-50%) scale(0.96);
      }
      #pov {
        position: fixed;
        left: 12px;
        bottom: max(24px, env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        margin: 0;
        padding: 0;
      }
      #pov button {
        min-width: 72px;
        min-height: 72px;
        padding: 8px 14px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        border: 3px solid transparent;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.9);
        color: #2f4a2f;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        touch-action: manipulation;
      }
      #pov button span {
        display: block;
      }
      #pov button[aria-pressed='true'] {
        border-color: #2f7d3b;
        background: #fff;
      }
      #pov button:active {
        transform: scale(0.94);
      }
      @keyframes hint-pulse {
        0%,
        100% {
          box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.25),
            0 0 0 0 rgba(255, 213, 79, 0.9);
        }
        50% {
          box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.25),
            0 0 0 12px rgba(255, 213, 79, 0);
        }
      }
      body.hint-glow #walk-button,
      body.hint-glow #pov button {
        animation: hint-pulse 1.2s ease-in-out infinite;
      }
      body.hint-static #walk-button,
      body.hint-static #pov button {
        outline: 4px solid #ffd54f;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        body.hint-glow #walk-button,
        body.hint-glow #pov button {
          animation: none;
          outline: 4px solid #ffd54f;
          outline-offset: 2px;
        }
      }
      #rotate-hint {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 12px 20px;
        border-radius: 999px;
        background: rgba(47, 74, 47, 0.9);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }
      #rotate-hint[hidden] {
        display: none;
      }
      @media (orientation: portrait) {
        #pov {
          bottom: calc(max(24px, env(safe-area-inset-bottom)) + 88px);
        }
      }
      #status {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: #2f4a2f;
        font-size: 14px;
      }
      #species {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
        pointer-events: none;
      }
      #species li {
        display: flex;
      }
      /* FR-4: the pill is the button now, so the row owns no padding and the
         button itself is the 72 px target. #species is pointer-events: none,
         so each button re-enables its own taps. */
      #species button {
        pointer-events: auto;
        min-inline-size: 72px;
        min-height: 72px;
        padding: 8px 14px;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: #2f4a2f;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }
      /* FR-6, FR-8: bottom-right sound stack, kept clear of #pov and Walk. */
      #audio-controls {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
      }
      #audio-controls button,
      #audio-panel button {
        min-width: 72px;
        min-height: 72px;
        padding: 8px 14px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        border: 3px solid transparent;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.9);
        color: #2f4a2f;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        touch-action: manipulation;
      }
      #audio-mute[aria-pressed='true'],
      #audio-panel-mute[aria-pressed='true'] {
        border-color: #2f7d3b;
        background: #fff;
      }
      #audio-controls button:focus-visible,
      #audio-panel button:focus-visible,
      #audio-panel input:focus-visible {
        outline: 4px solid #ffd54f;
        outline-offset: 2px;
      }
      #audio-parent {
        --hold-progress: 0;
        position: relative;
        isolation: isolate;
      }
      /* NFR-4: progress fills a static conic ring; no animation, no motion. */
      #audio-parent::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        background: conic-gradient(
          #2f7d3b calc(var(--hold-progress) * 1turn),
          rgba(47, 125, 59, 0.18) 0
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 6px),
          #000 calc(100% - 6px)
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
        pointer-events: none;
      }
      /* FR-8: the panel sits above the 72 px stack, never over the buttons. */
      #audio-panel {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: calc(max(24px, env(safe-area-inset-bottom)) + 180px);
        z-index: 3;
        display: grid;
        gap: 12px;
        width: min(320px, calc(100vw - 24px));
        margin: 0;
        padding: 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.96);
        color: #2f4a2f;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      #audio-panel[hidden] {
        display: none;
      }
      #audio-panel h2 {
        margin: 0;
        font-size: 20px;
      }
      #audio-panel label {
        font-size: 16px;
        font-weight: 700;
      }
      #audio-panel input[type='range'] {
        width: 100%;
        min-height: 72px;
      }
      #audio-volume-value {
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <p id="status" role="status">Loading…</p>
      <ul id="species" aria-label="Dino babies">
        <li><button type="button" data-species="trike">🦕 Trike</button></li>
        <li><button type="button" data-species="stego">🦖 Stego</button></li>
        <li><button type="button" data-species="brachio">🦒 Brachio</button></li>
      </ul>
      <button id="walk-button" type="button" aria-pressed="false">Walk</button>
      <nav id="pov" aria-label="Viewpoints">
        <button id="pov-ranch" type="button" data-pov="ranch" aria-pressed="true">
          🏠<span>Ranch</span>
        </button>
        <button id="pov-nest" type="button" data-pov="nest" aria-pressed="false">
          🪹<span>Nest</span>
        </button>
        <button id="pov-garden" type="button" data-pov="garden" aria-pressed="false">
          🌼<span>Garden</span>
        </button>
      </nav>
      <div id="audio-controls" role="group" aria-label="Sound">
        <button id="audio-mute" type="button" aria-pressed="false">🔊 Sound</button>
        <button
          id="audio-parent"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="audio-panel"
          aria-label="Parent volume settings"
        >
          ⚙️ Volume
        </button>
      </div>
      <section id="audio-panel" role="dialog" aria-labelledby="audio-panel-title" hidden>
        <h2 id="audio-panel-title">Volume</h2>
        <label for="audio-volume">Sound level</label>
        <input id="audio-volume" type="range" min="0" max="100" step="1" value="80" />
        <output id="audio-volume-value" for="audio-volume">80%</output>
        <button id="audio-panel-mute" type="button" aria-pressed="false">🔊 Sound</button>
        <button id="audio-panel-close" type="button">Close</button>
      </section>
      <p id="rotate-hint" hidden>🔄 Turn your tablet sideways</p>
    </main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
