# pnpm settings for this single-package repo.
#
# `sharp` is the icon generator's rasterizer and `esbuild` backs vite/vitest.
# pnpm 12 refuses to run unapproved dependency build scripts and then warns that
# `node_modules` may be out of sync on every install. Both packages expect their
# own postinstall to run, so approving them keeps `pnpm install` and `pnpm verify`
# quiet and deterministic.
onlyBuiltDependencies:
  - esbuild
  - sharp
