name: CI
on:
  pull_request:
    branches: [main]
    paths-ignore: [conductor/**]
  push:
    branches: [main]
    paths-ignore: [conductor/**]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
